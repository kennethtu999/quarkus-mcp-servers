quarkus.package.jar.type=uber-jar
quarkus.package.jar.add-runner-suffix=false
quarkus.package.main-class=ai-db-mcp

# stdout is the MCP protocol channel: no HTTP listener, no banner, all logging to stderr
quarkus.mcp.server.stdio.enabled=true
quarkus.http.host-enabled=false
quarkus.banner.enabled=false
quarkus.log.console.stderr=true
